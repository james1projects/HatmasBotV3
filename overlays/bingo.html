<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stream Bingo</title>
<link rel="stylesheet" href="/overlays/hatmas_theme.css">
<style>
  html, body { background: transparent; margin: 0; font-family: 'Inter', 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased; user-select: none; }
  #wrap { position: fixed; top: 40px; right: 40px; width: 360px; opacity: 0; transform: translateY(-8px);
    transition: opacity 0.25s ease, transform 0.25s ease; }
  #wrap.visible { opacity: 1; transform: translateY(0); }
  .panel { background: var(--panel, rgba(26, 35, 46, 0.94)); color: var(--text, #F2F4F7);
    border-radius: 8px; overflow: hidden; }
  .head { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px;
    background: var(--accent, #E5A26B); color: var(--bg, #202C39);
    font-family: 'BigNoodleTitling', 'Bebas Neue', 'Inter', sans-serif; font-size: 26px; letter-spacing: 0.06em; text-transform: uppercase; }
  .head .pot { font-size: 18px; }
  .row { display: flex; justify-content: space-between; padding: 8px 14px; font-size: 15px; border-top: 1px solid rgba(255,255,255,0.06); }
  .row .k { color: var(--text-dim, #A9B4C0); }
  .call { padding: 12px 14px; font-size: 22px; line-height: 1.2; border-top: 1px solid rgba(255,255,255,0.06); }
  .call small { display: block; font-size: 12px; color: var(--text-dim, #A9B4C0); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
  .lead { padding: 8px 14px 12px; font-size: 14px; color: var(--text-dim, #A9B4C0); border-top: 1px solid rgba(255,255,255,0.06); }
  .lead b { color: var(--text, #F2F4F7); }
  #wrap.win .head { background: var(--green, #4CC38A); }
  #win { display: none; padding: 16px 14px; font-family: 'BigNoodleTitling', 'Bebas Neue', 'Inter', sans-serif; font-size: 34px; letter-spacing: 0.04em; text-transform: uppercase; text-align: center; }
  #wrap.win #win { display: block; }
</style>
</head>
<body>
  <div id="wrap">
    <div class="panel">
      <div class="head"><span>Stream Bingo</span><span class="pot" id="pot"></span></div>
      <div id="win"></div>
      <div class="row"><span class="k">Cards in play</span><span id="cards">0</span></div>
      <div class="call"><small>Last call</small><span id="call">Waiting for the first call</span></div>
      <div class="lead" id="lead">Get a card at hatmaster.tv/bingo</div>
    </div>
  </div>
  <script src="/overlays/overlay_client.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const wrap = $('wrap');
    function render(d) {
      if (!d) return;
      $('pot').textContent = (d.pot != null ? d.pot + ' Hats' : '');
      $('cards').textContent = (d.cards || 0) + ' (' + (d.players || 0) + ' players)';
      if (d.call && d.call.label) $('call').textContent = d.call.label;
      const lead = (d.leaders || [])[0];
      $('lead').innerHTML = lead
        ? '<b>' + lead.display + '</b> needs ' + lead.to_bingo + ' more' + (lead.to_bingo === 1 ? ' square' : ' squares')
        : 'Get a card at hatmaster.tv/bingo';
      if (d.winner && d.winner.display) {
        wrap.classList.add('win');
        $('win').textContent = 'BINGO! ' + d.winner.display;
      } else {
        wrap.classList.remove('win');
      }
    }
    // Rules: show on bingo_open / bingo_call / bingo_win, hide on bingo_closed.
    HatmasOverlay.connect('bingo', {
      container: '#wrap',
      onShow(data) { render(data); },
      onUpdate(data) { render(data); }
    });
  </script>
</body>
</html>
